services:
  web:
    image: ${DOCKER_USERNAME}/murrabi:${BRANCH}
    build:
        context: ./
        dockerfile: ./.docker/php/Dockerfile
    # ports:
    #    - ${APP_PORT:-8000}:8000
    #    - ${VITE_PORT:-5173}:${VITE_PORT:-5173}
    volumes:
      - ./:${WORKDIR}
      - ./vendor/:${WORKDIR}/vendor
    networks:
      - reverse_proxy
      - mmpi2_dev_network
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.rule=Host(`mmpi2.porto.rekycode.id`)
      - traefik.http.routers.web.tls.certresolver=mytlschallenge
      - traefik.http.services.web.loadbalancer.server.port=8000
      - traefik.http.routers.web.middlewares=auth
      - traefik.docker.network=reverse_proxy
    depends_on:
      - mysql
      - redis
  mysql:
    container_name: mmpi2-dev-mysql
    image: mysql/mysql-server:${MYSQL_VERSION:-8.0}
    # ports:
    #    - ${FORWARD_DB_PORT:-3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - ${DB_VOLUME_LOCAL:-./database/mysql-test-data}:/var/lib/mysql
    networks:
      - mmpi2_dev_network
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -p${DB_PASSWORD}
      retries: 3
      timeout: 5s
  redis:
    container_name: mmpi2-dev-redis
    image: redis:alpine
    # ports:
    #    - ${FORWARD_REDIS_PORT:-6379}:6379
    volumes:
      - ${REDIS_VOLUME_LOCAL:-./database/redis-data}:/data
    networks:
      - mmpi2_dev_network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
  phpmyadmin:
    container_name: mmpi2-dev-phpmyadmin
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mmpi2-dev-mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - reverse_proxy
      - mmpi2_dev_network
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin.rule=Host(`pma.porto.rekycode.id`)
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      - traefik.http.routers.phpmyadmin.tls.certresolver=mytlschallenge
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80
      - traefik.http.routers.phpmyadmin.middlewares=auth
      - traefik.docker.network=reverse_proxy
networks:
  reverse_proxy:
    external: true
  mmpi2_dev_network:
    name: mmpi2_dev_network
    driver: bridge
