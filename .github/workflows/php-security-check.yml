name: PHP Security Check
run-name: php-security-check

on:
  push:
    branches:
      - filament
  pull_request:
    branches:
      - filament

jobs:
  php-security-check:
    permissions:
      contents: read
      security-events: write
    name: PHP Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: notify-start
        uses: slackapi/slack-github-action@v2.0.0
        id: notify_start
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL }}
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "PHP Security Check started"
              - type: section
                text:
                  type: mrkdwn
                  text: "Commit details: \n- Repository: ${{ github.repository }} \n- Commit: ${{ github.sha }} \n- Author: ${{ github.actor }} \n- Message: ${{ github.event.head_commit.message }} \n- Date: ${{ github.event.head_commit.timestamp }}"
      - run: echo "${{ steps.notify_start.outputs.ts }}" > notify_start_ts.txt
      - name: Share notify_start_ts with subsequent jobs via artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notify-start-ts
          path: notify_start_ts.txt
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/php@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --sarif-file-output=snyk.sarif
      - name: Archive Snyk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-snyk-results.sarif
          path: snyk.sarif
      - name: Upload result to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

  notify-after-check:
    name: Notify Slack after PHP Security Check
    runs-on: ubuntu-latest
    needs: [php-security-check]
    if: always() # Ensure this runs even if the previous job fails
    steps:
      - name: Download Snyk results
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.sha }}-snyk-results.sarif
      - name: Parse SARIF and Check for Vulnerabilities
        id: parse_sarif
        run: |
          if jq -e 'first(.runs[].tool.driver.rules | length) > 0' *.sarif > /dev/null; then
            echo "Vulnerabilities found."
            echo "::set-output name=has_vulnerabilities::true"
          else
            echo "No vulnerabilities found."
            echo "::set-output name=has_vulnerabilities::false"
          fi
      - name: Set SARIF file
        id: set_sarif_file
        run: echo "sarif_file=$(find . -name '*.sarif')" >> $GITHUB_ENV
      - name: Download notify_start_ts
        uses: actions/download-artifact@v4
        with:
          name: notify-start-ts
      - run: echo "notify_start_ts=$(cat notify_start_ts.txt)" >> $GITHUB_ENV
      - run: cat $GITHUB_ENV
      - name: Prepare Slack message
        id: prepare_slack_message
        if: steps.parse_sarif.outputs.has_vulnerabilities == 'true'
        run: |
          if [ -f ${{ env.sarif_file }} ]; then
            # Extract issues with severity levels and emojis
            formatted_issues=$(jq -r '.runs[].tool.driver.rules[] |
              (if .properties["security-severity"] | tonumber <= 3.9 then "🟢 [LOW]"
               elif .properties["security-severity"] | tonumber <= 6.9 then "🟡 [MEDIUM]"
               elif .properties["security-severity"] | tonumber <= 8.9 then "🔴 [HIGH]"
               else "🚨 [CRITICAL]" end) +
              " \(.shortDescription.text)\n\(.fullDescription.text)"' "${{ env.sarif_file }}")
            echo "issues=$(echo "$formatted_issues" | base64 -w 0)" >> $GITHUB_ENV
          else
            echo "SARIF file not found"
            exit 1
          fi
      - run: cat $GITHUB_ENV
      - name: Notify Slack if vulnerabilities found
        if: steps.parse_sarif.outputs.has_vulnerabilities == 'true' && env.issues != ''
        run: |
          decoded_issues=$(echo "${{ env.issues }}" | base64 --decode)

          # Prepare the JSON payload
          payload=$(jq -n --arg channel "${{ secrets.SLACK_CHANNEL }}" \
                --arg ts "${{ env.notify_start_ts }}" \
                --arg text "PHP Security Check: Vulnerabilities Found 🚨" \
                --arg file "${{ env.sarif_file }}" \
                --arg filename "${{ github.sha }}-snyk-results.sarif" \
                --arg blocks "$(jq -n \
                  --arg commits_message "$commits_message" \
                  --arg decoded_issues "$decoded_issues" \
                  '[
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "PHP Security Check: Vulnerabilities Found 🚨"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": $decoded_issues
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "Due to the presence of vulnerabilities, the commit *${{ github.event.head_commit.message }}* is not safe to deploy. Please fix the vulnerabilities and make sure your app is *unhackable*."
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Checked by *${{ github.actor }}* in repository *${{ github.repository }}* on commit *${{ github.sha }}*"
                        }
                      ]
                    }
                  ]')" \
                '{
                  channel: $channel,
                  text: $text,
                  ts: $ts,
                  file: $file,
                  filename: $filename,
                  blocks: ($blocks | fromjson)
                }')
                echo $payload
                request=$(curl -X POST -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
                   -H "Content-Type: application/json; charset=utf-8" \
                   -d "$payload" https://slack.com/api/chat.update --silent)
                # {"ok":true,"channel":"***","ts":"1736878113.948639","text":"PHP Security Check: Vulnerabilities Found :rotating_light:","message":{"user":"U08875WKVFX","type":"message","edited":{"user":"B088CGBAF36","ts":"1736878142.000000"},"bot_id":"B088CGBAF36","app_id":"A0883C9QUQN","text":"PHP Security Check: Vulnerabilities Found :rotating_light:","team":"T087V7ACJPR","bot_profile":{"id":"B088CGBAF36","app_id":"A0883C9QUQN","name":"Satpam Server","icons":{"image_36":"https:\/\/a.slack-edge.com\/80588\/img\/plugins\/app\/bot_36.png","image_48":"https:\/\/a.slack-edge.com\/80588\/img\/plugins\/app\/bot_48.png","image_72":"https:\/\/a.slack-edge.com\/80588\/img\/plugins\/app\/service_72.png"},"deleted":false,"updated":1736763387,"team_id":"T087V7ACJPR"},"blocks":[{"type":"header","block_id":"EtzSb","text":{"type":"plain_text","text":"PHP Security Check: Vulnerabilities Found :rotating_light:","emoji":true}}}
                # get message.edited.ts
                echo "ts=$(echo $request | jq -r '.message.edited.ts')" >> $GITHUB_ENV

      - name: Upload sarif file
        uses: MeilCli/slack-upload-file@v4
        with:
          channel_id: ${{ secrets.SLACK_CHANNEL }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          initial_comment: "PHP Security Check: Vulnerabilities Found 🚨"
          file_type: json
          file_path: "${{ env.sarif_file }}"
          file_name: "${{ github.sha }}-snyk-results.sarif"
          title: "${{ github.sha }}-snyk-results.sarif"
          thread_ts: ${{ env.ts }}

      - name: Notify Slack if no vulnerabilities found
        if: steps.parse_sarif.outputs.has_vulnerabilities == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL }}
            ts: ${{ env.notify_start_ts }}
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "PHP Security Check found no vulnerabilities"
              - type: section
                text:
                  type: mrkdwn
                  text: "Commit details: \n- Repository: ${{ github.repository }} \n- Commit: ${{ github.sha }} \n- Author: ${{ github.actor }} \n- Message: ${{ github.event.head_commit.message }} \n- Date: ${{ github.event.head_commit.timestamp }}"
              - type: section
                text:
                  type: mrkdwn
                  text: ":tada: No vulnerabilities found in the PHP code. :tada:"
